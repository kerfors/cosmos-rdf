name: pages

# Rebuilds the GitHub Pages site from every release tag. The site is the
# dereference target of https://w3id.org/cdisc/cosmos/ (docs/htaccess.txt):
# /vX.Y.Z/<graph>.{ttl,nt,rdf,jsonld} per tag, Turtle canonical and the other
# three derived from it here, plus an index page per release and at the root.
# Nothing is copied by hand: the site is a function of the tags.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install rdflib==7.1.4
      - name: Build the site from every release tag
        run: python scripts/build_pages.py site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
